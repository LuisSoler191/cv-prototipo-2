<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <!-- Background -->
  <rect width="120" height="120" rx="18" fill="#0d1117"/>
  <!-- Terminal frame -->
  <rect x="12" y="18" width="96" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <!-- Traffic lights -->
  <circle cx="28" cy="31" r="5" fill="#ff5f57"/>
  <circle cx="44" cy="31" r="5" fill="#febc2e"/>
  <circle cx="60" cy="31" r="5" fill="#28c840"/>
  <!-- Key icon inside terminal -->
  <circle cx="47" cy="62" r="12" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <circle cx="47" cy="62" r="5" fill="#58a6ff"/>
  <line x1="59" y1="62" x2="80" y2="62" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="74" y1="62" x2="74" y2="70" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <line x1="80" y1="62" x2="80" y2="70" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  <!-- SSH label -->
  <text x="60" y="108" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#58a6ff" text-anchor="middle" letter-spacing="3">SSH</text>
</svg>