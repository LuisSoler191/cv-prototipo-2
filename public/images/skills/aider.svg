<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 110" width="110" height="110">
  <!-- Rounded square, deep dark bg -->
  <rect width="110" height="110" rx="20" fill="#111827"/>
  <!-- Green glow circle behind prompt -->
  <circle cx="38" cy="45" r="22" fill="#00d26a" opacity="0.08"/>
  <!-- Terminal prompt > -->
  <text x="16" y="62" font-family="'Courier New', monospace" font-size="42" font-weight="bold" fill="#00d26a">&#62;</text>
  <!-- Cursor block (blinking metaphor) -->
  <rect x="62" y="33" width="16" height="28" rx="3" fill="#00d26a"/>
  <!-- Subtle scanline lines -->
  <line x1="10" y1="78" x2="100" y2="78" stroke="#00d26a" stroke-width="0.5" opacity="0.2"/>
  <line x1="10" y1="84" x2="100" y2="84" stroke="#00d26a" stroke-width="0.5" opacity="0.15"/>
  <!-- "aider" word bottom -->
  <text x="12" y="102" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#00d26a" letter-spacing="1.5" opacity="0.9">aider</text>
</svg>
